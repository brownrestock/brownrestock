<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://szxojmygsqxjqeyqjgre.supabase.co";
const SUPABASE_KEY = sb_publishable_ytwy5iHgA4_LQkwD5mSTWA_-lS8dtU0 ;

const supabaseClient = window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

let casseDisponibili = [];

function getFotoUrl(foto) {
if (!foto) return null;

if (foto.startsWith("http://") || foto.startsWith("https://")) {
return foto;
}

const { data } = supabaseClient.storage
.from("casse-foto")
.getPublicUrl(foto);

return data.publicUrl;
}

function mostraCasse() {
const container = document.getElementById("cases");
container.innerHTML = "";

for (let i = 1; i <= 10; i++) {
const cassa = casseDisponibili.find(
item => Number(item.numero) === i
);

const button = document.createElement("button");
button.className = "case" + (
cassa && cassa.stato === "Disponibile" ? "" : " unavailable"
);
button.type = "button";

button.innerHTML =
'<span class="number">' + i + '</span>' +
'<span class="label">KASSE ' + i + '</span>' +
'<span class="case-status">' +
(cassa && cassa.stato === "Disponibile"
? "ANGEBOT VERFÜGBAR"
: "DERZEIT NICHT VERFÜGBAR") +
'</span>';

button.addEventListener("click", () => openCase(i));
container.appendChild(button);
}
}

function openCase(number) {
const cassa = casseDisponibili.find(
item => Number(item.numero) === number
);

document.getElementById("modalTitle").textContent =
"KASSE " + number;

document.getElementById("contactLink").href =
"mailto:info@brownrestock.de?subject=" +
encodeURIComponent("Anfrage für Kasse " + number);

document.getElementById("modal").classList.add("open");
}

function closeModal() {
document.getElementById("modal").classList.remove("open");
}

function closeOutside(event) {
if (event.target.id === "modal") closeModal();
}

document.addEventListener("keydown", function(event) {
if (event.key === "Escape") closeModal();
});

async function caricaCasse() {
const container = document.getElementById("cases");

const { data, error } = await supabaseClient
.from("casse")
.select("numero, titolo, prezzo, foto, stato");

if (error) {
console.error("Errore Supabase:", error);
container.innerHTML =
'<p style="color:#e99;text-align:center;">Angebote konnten nicht geladen werden.</p>';
return;
}

casseDisponibili = data || [];
mostraCasse();
}

caricaCasse();
</script>
