<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BrownReStock | Smart Stock. Second Life.</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* { box-sizing: border-box; }

body {
margin: 0;
background: #080808;
color: #fff;
font-family: Arial, sans-serif;
}

header {
text-align: center;
padding: 35px 15px 25px;
border-bottom: 1px solid #a98235;
}

.logo {
width: 210px;
max-width: 80%;
height: auto;
object-fit: contain;
}

header h1 {
color: #d6ad59;
font-size: 28px;
letter-spacing: 3px;
margin: 15px 0 8px;
}

header p {
color: #aaa;
letter-spacing: 2px;
font-size: 12px;
}

nav {
padding: 16px;
text-align: center;
border-bottom: 1px solid #292929;
}

nav a {
color: #d6ad59;
text-decoration: none;
margin: 0 12px;
font-size: 13px;
}

main {
max-width: 1100px;
margin: auto;
padding: 35px 18px;
}

.intro {
text-align: center;
margin-bottom: 35px;
}

.intro h2 {
color: #d6ad59;
letter-spacing: 2px;
}

.intro p { color: #aaa; }

.cases {
display: grid;
grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
gap: 16px;
}

.case {
background: #111;
border: 1px solid #8f6c2d;
border-radius: 10px;
padding: 24px 12px;
color: white;
cursor: pointer;
min-height: 145px;
transition: .2s;
text-align: center;
}

.case:hover {
background: #211b10;
border-color: #e0b85f;
transform: translateY(-3px);
}

.case .number {
display: block;
font-size: 27px;
color: #d6ad59;
font-weight: bold;
}

.case .label {
display: block;
margin-top: 8px;
font-size: 12px;
letter-spacing: 2px;
}

.case .status {
display: block;
margin-top: 10px;
color: #aaa;
font-size: 11px;
}

.case-price {
margin-top: 13px;
padding-top: 10px;
border-top: 1px solid #383024;
color: #d6ad59;
font-size: 12px;
line-height: 1.7;
}

.case-total {
font-weight: bold;
font-size: 14px;
color: #d6ad59;
font-size: 15px;
font-weight: bold;
line-height: 2;
margin: 20px 0;
padding: 15px;
background: #19150e;
border: 1px solid #554322;
border-radius: 8px;
}

.price-total {
display: block;
color: #f0c66c;
font-size: 21px;
border-top: 1px solid #554322;
margin-top: 8px;
padding-top: 10px;
function formatPrice(value) {
return Number(value).toLocaleString("de-DE", {
minimumFractionDigits: 2,
maximumFractionDigits: 2
}) + " €";
}

function getPrices(item) {
const product = item?.prezzo_prodotto;
const shipping = item?.prezzo_spedizione;

if (
product === null || product === undefined || product === "" ||
shipping === null || shipping === undefined || shipping === ""
) {
return null;
}

const productPrice = Number(product);
const shippingPrice = Number(shipping);

if (
!Number.isFinite(productPrice) ||
!Number.isFinite(shippingPrice) ||
productPrice < 0 ||
shippingPrice < 0
) {
return null;
}

return {
product: productPrice,
shipping: shippingPrice,
total: productPrice + shippingPrice
};
}

function priceHTML(item) {
const prices = getPrices(item);

if (!prices) {
return "Preis auf Anfrage";
}

return `
<div>Warenpreis: ${formatPrice(prices.product)}</div>
<div>Versandkosten: ${formatPrice(prices.shipping)}</div>
<div class="case-total">
Gesamtpreis: ${formatPrice(prices.total)}
</div>
`;
}

function modalPriceHTML(item) {
const prices = getPrices(item);

if (!prices) {
return "Preis auf Anfrage";
}

return `
<div>Warenpreis: ${formatPrice(prices.product)}</div>
<div>Versandkosten: ${formatPrice(prices.shipping)}</div>
<span class="price-total">
Gesamtpreis: ${formatPrice(prices.total)}
</span>
`;
}

async function getPhotoUrl(value) {
if (!value) return "";

if (/^https?:\/\//i.test(value)) {
return value;
}

const { data, error } = await db.storage
.from(BUCKET)
.createSignedUrl(value, 3600);

if (error) {
console.error("Foto nicht geladen:", error);
return "";
}

return data?.signedUrl || "";
}

function isUnavailable(item) {
const status = item?.stato;

if (status === false) return true;

const value = String(status ?? "").toLowerCase().trim();

return [
"false",
"nicht verfügbar",
"nicht verfugbar",
"nicht_verfügbar",
"nicht_verfugbar",
"ausverkauft",
"sold",
"unavailable"
].includes(value);
}

async function loadCases() {
const container = document.getElementById("cases");

const { data, error } = await db
.from("casse")
.select("*")
.order("id", { ascending: true });

if (error) {
console.error(error);
container.innerHTML =
'<p class="error">Angebote konnten nicht geladen werden.</p>';
return;
}

casse = data || [];
container.innerHTML = "";

for (let i = 1; i <= 10; i++) {
const item = casse.find(c =>
Number(c.numero ?? c.id) === i
);

const button = document.createElement("button");
button.className = "case";
button.type = "button";

const title = item?.titolo || "KASSE " + i;

const status = isUnavailable(item)
? "Nicht verfügbar"
: "Angebot ansehen";

button.innerHTML = `
<span class="number">${i}</span>
<span class="label">${escapeHTML(title)}</span>
<span class="status">${status}</span>
<div class="case-price">
${priceHTML(item)}
</div>
`;

button.addEventListener("click", () => openCase(i));

container.appendChild(button);
}
}

function escapeHTML(value) {
return String(value).replace(/[&<>"']/g, char => ({
"&": "&amp;",
"<": "&lt;",
">": "&gt;",
'"': "&quot;",
"'": "&#39;"
})[char]);
}

async function openCase(number) {
const item = casse.find(c =>
Number(c.numero ?? c.id) === number
);

document.getElementById("modalTitle").textContent =
item?.titolo || "KASSE " + number;

document.getElementById("description").textContent =
item?.descrizione || "Weitere Informationen auf Anfrage.";

document.getElementById("price").innerHTML =
modalPriceHTML(item);

const imageBox = document.getElementById("productImage");
imageBox.textContent = "Foto wird geladen...";

document.getElementById("contactLink").href =
"mailto:info@brownrestock.de?subject=" +
encodeURIComponent("Anfrage zu Kasse " + number);

document.getElementById("modal").classList.add("active");

const photo = await getPhotoUrl(item?.foto_url);

if (!document.getElementById("modal").classList.contains("active")) {
return;
}

if (photo) {
const img = document.createElement("img");
img.src = photo;
img.alt = "Produktfoto Kasse " + number;

img.onerror = () => {
imageBox.textContent = "Produktfoto nicht verfügbar";
};

imageBox.replaceChildren(img);
} else {
imageBox.textContent = "Produktfoto folgt";
}
}

function closeModal() {
document.getElementById("modal").classList.remove("active");
}

function closeOutside(event) {
if (event.target.id === "modal") {
closeModal();
}
}

document.addEventListener("keydown", event => {
if (event.key === "Escape") closeModal();
});

loadCases();
</script>

</body>
</html>
