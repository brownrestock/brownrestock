<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BrownReStock | Smart Stock. Second Life.</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* { box-sizing: border-box; }

body {
margin: 0;
background: #080808;
color: #fff;
font-family: Arial, sans-serif;
}

header {
text-align: center;
padding: 35px 15px 25px;
border-bottom: 1px solid #a98235;
}

.logo {
width: 210px;
max-width: 80%;
height: auto;
object-fit: contain;
}

header h1 {
color: #d6ad59;
font-size: 28px;
letter-spacing: 3px;
margin: 15px 0 8px;
}

header p {
color: #aaa;
letter-spacing: 2px;
font-size: 12px;
}

nav {
padding: 16px;
text-align: center;
border-bottom: 1px solid #292929;
}

nav a {
color: #d6ad59;
text-decoration: none;
margin: 0 12px;
font-size: 13px;
}

main {
max-width: 1100px;
margin: auto;
padding: 35px 18px;
}

.intro {
text-align: center;
margin-bottom: 35px;
}

.intro h2 {
color: #d6ad59;
letter-spacing: 2px;
}

.intro p { color: #aaa; }

.cases {
display: grid;
grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
gap: 16px;
}

.case {
background: #111;
border: 1px solid #8f6c2d;
border-radius: 10px;
padding: 24px 12px;
color: white;
cursor: pointer;
min-height: 140px;
transition: .2s;
}

.case:hover {
background: #211b10;
border-color: #e0b85f;
transform: translateY(-3px);
}

.case .number {
display: block;
font-size: 27px;
color: #d6ad59;
font-weight: bold;
}

.case .label {
display: block;
margin-top: 8px;
font-size: 12px;
letter-spacing: 2px;
}

.case .status {
display: block;
margin-top: 10px;
color: #aaa;
font-size: 11px;
}

.case .card-price {
display: block;
margin-top: 10px;
color: #e2b95e;
font-size: 17px;
font-weight: bold;
<div class="price" id="price">Preis auf Anfrage</div>

<a class="contact" id="contactLink"
href="mailto:info@brownrestock.de">
ANFRAGE SENDEN
</a>
</div>
</div>

<footer id="contact">
<p>SMART STOCK. SECOND LIFE.</p>
<p>📦 Retouren · Restposten · Elektronik</p>
<p><a href="mailto:info@brownrestock.de">info@brownrestock.de</a></p>
<p>© 2026 BrownReStock</p>
</footer>

<script>
const SUPABASE_URL = "https://szxojmygsqxjqeyqjgre.supabase.co";
const SUPABASE_KEY = "sb_publishable_ytwy5iHgA4_LQkwD5mSTWA_-lS8dtU0";

const db = window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

const BUCKET = "casse-foto";
let casse = [];

function escapeHTML(value) {
return String(value).replace(/[&<>"']/g, char => ({
"&": "&amp;",
"<": "&lt;",
">": "&gt;",
'"': "&quot;",
"'": "&#39;"
})[char]);
}

// Gestisce prezzi sia numerici che con virgola decimale
function formatPrice(value) {
if (value === null || value === undefined || value === "") {
return "Prezzo su richiesta";
}

let normalized = String(value).trim();

normalized = normalized.replace(/[€\s]/g, "");

if (normalized.includes(",")) {
normalized = normalized.replace(/\./g, "").replace(",", ".");
}

const number = Number(normalized);

if (!Number.isFinite(number)) {
return "Prezzo su richiesta";
}

return number.toLocaleString("de-DE", {
minimumFractionDigits: 2,
maximumFractionDigits: 2
}) + " €";
}

function isAvailable(item) {
const status = String(item?.stato ?? "").trim().toLowerCase();

return !["non disponibile", "non_disponibile", "esaurito", "venduto", "false", "0"].includes(status);
}

async function getPhotoUrl(value) {
if (!value) return "";

if (/^https?:\/\//i.test(value)) {
return value;
}

const { data, error } = await db.storage
.from(BUCKET)
.createSignedUrl(value, 3600);

if (error) {
console.error("Foto nicht geladen:", error);
return "";
}

return data.signedUrl;
}

async function loadCases() {
const container = document.getElementById("cases");

const { data, error } = await db
.from("casse")
.select("*")
.order("id", { ascending: true });

if (error) {
console.error("Supabase Fehler:", error);
container.innerHTML =
'<p class="error">Angebote konnten nicht geladen werden.</p>';
return;
}

casse = data || [];

console.log("BrownReStock Angebote:", casse);

container.innerHTML = "";

for (let i = 1; i <= 10; i++) {
const item = casse.find(c =>
Number(c.numero ?? c.id) === i
);

const button = document.createElement("button");
button.className = "case";
button.type = "button";

const title = item?.titolo || "KASSE " + i;
const available = item ? isAvailable(item) : false;

button.innerHTML = `
<span class="number">${i}</span>
<span class="label">${escapeHTML(title)}</span>
${item && item.prezzo != null
? `<span class="card-price">${escapeHTML(formatPrice(item.prezzo))}</span>`
: ""}
<span class="status">${
!item ? "Demnächst verfügbar" :
available ? "Angebot ansehen" : "Nicht verfügbar"
}</span>
`;

button.addEventListener("click", () => openCase(i));
container.appendChild(button);
}
}

async function openCase(number) {
const item = casse.find(c =>
Number(c.numero ?? c.id) === number
);

if (!item) {
return;
}

document.getElementById("modalTitle").textContent =
item.titolo || "KASSE " + number;

document.getElementById("description").textContent =
item.descrizione || "Weitere Informationen auf Anfrage.";

document.getElementById("price").textContent =
formatPrice(item.prezzo);

const imageBox = document.getElementById("productImage");
imageBox.textContent = "Foto wird geladen...";

document.getElementById("contactLink").href =
"mailto:info@brownrestock.de?subject=" +
encodeURIComponent("Anfrage zu Kasse " + number);

document.getElementById("modal").classList.add("active");

const photo = await getPhotoUrl(item.foto);

if (photo) {
const img = document.createElement("img");
img.src = photo;
img.alt = "Produktfoto Kasse " + number;

img.onerror = () => {
imageBox.textContent = "Produktfoto nicht verfügbar";
};

imageBox.replaceChildren(img);
} else {
imageBox.textContent = "Produktfoto folgt";
}
}

function closeModal() {
document.getElementById("modal").classList.remove("active");
}

function closeOutside(event) {
if (event.target.id === "modal") {
closeModal();
}
}

document.addEventListener("keydown", event => {
if (event.key === "Escape") closeModal();
});

loadCases();
</script>

</body>
</html>
